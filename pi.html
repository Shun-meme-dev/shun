<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title> mã màu CSS</title>
    <style>
        .hop-thong-bao {
            background-color: #f1f2f6;
            color: #2f3542;          
            padding: 20px;
            border-radius: 8px;
        }
        .nut-thanh-cong {
            background-color: #2ed573;
            color: #ffffff;          
            padding: 10px 20px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="hop-thong-bao">
        <h2>Tiêu đề thông báo</h2>
        <p>Đoạn văn bản này sử dụng mã màu để hiển thị rõ ràng, dễ nhìn.</p>
        <button class="nut-thanh-cong">Xác nhận</button>
    </div>

</body>
</html>
