<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Rubik 3D tương tác đầy đủ</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle, #222 0%, #000 100%);
            font-family: Arial, sans-serif;
        }
        #guide {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            pointer-events: none;
            font-size: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<div id="guide">✨ <b>Click và kéo trực tiếp trên mặt Rubik</b> để xoay tầng | Kéo ở khoảng trống để xoay góc nhìn</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    let scene, camera, renderer, controls;
    let rubikGroup, raycaster, mouse;
    let isMouseDown = false, isRotatingLayer = false;
    let intersectedObject = null, intersectFaceNormal = null;
    let startMousePosition = new THREE.Vector2();
    let currentPlane = new THREE.Plane();
    let planeIntersectPoint = new THREE.Vector3();

    init();
    animate();

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 6, 8);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(10, 20, 15);
        scene.add(light);

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        rubikGroup = new THREE.Group();
        const colors = [0xff3b30, 0xff9500, 0xffcc00, 0xffffff, 0x34c759, 0x007aff];
        
        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const geometry = new THREE.BoxGeometry(0.92, 0.92, 0.92);
                    const materials = colors.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.2 }));
                    const cube = new THREE.Mesh(geometry, materials);
                    cube.position.set(x, y, z);
                    rubikGroup.add(cube);
                }
            }
        }
        scene.add(rubikGroup);

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    function onPointerDown(event) {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(rubikGroup.children);

        if (intersects.length > 0) {
            controls.enabled = false;
            isMouseDown = true;
            isRotatingLayer = false;
            
            startMousePosition.set(event.clientX, event.clientY);
            
            const intersect = intersects[0];
            intersectedObject = intersect.object;
            intersectFaceNormal = intersect.face.normal.clone();
            intersectFaceNormal.transformDirection(intersect.object.matrixWorld);
        } else {
            controls.enabled = true;
        }
    }

    function onPointerMove(event) {
        if (!isMouseDown || isRotatingLayer) return;

        const deltaX = event.clientX - startMousePosition.x;
        const deltaY = event.clientY - startMousePosition.y;

        if (Math.hypot(deltaX, deltaY) > 15) {
            isRotatingLayer = true;
            executeLayerRotation(intersectedObject, intersectFaceNormal, deltaX, deltaY);
        }
    }

    function onPointerUp() {
        isMouseDown = false;
        isRotatingLayer = false;
        controls.enabled = true;
    }

    function executeLayerRotation(targetCube, faceNormal, deltaX, deltaY) {
        let tolerance = 0.1;
        let activeCubes = [];
        let pos = targetCube.position;

        rubikGroup.children.forEach(cube => {
            if (Math.abs(faceNormal.x) > tolerance && Math.abs(cube.position.x - pos.x) < 0.5) activeCubes.push(cube);
            else if (Math.abs(faceNormal.y) > tolerance && Math.abs(cube.position.y - pos.y) < 0.5) activeCubes.push(cube);
            else if (Math.abs(faceNormal.z) > tolerance && Math.abs(cube.position.z - pos.z) < 0.5) activeCubes.push(cube);
        });

        let axis = new THREE.Vector3();
        if (Math.abs(faceNormal.x) > tolerance) axis.set(0, 1, 0);
        else if (Math.abs(faceNormal.y) > tolerance) axis.set(0, 0, 1);
        else axis.set(1, 0, 0);

        let pivot = new THREE.Group();
        scene.add(pivot);
        activeCubes.forEach(cube => pivot.attach(cube));

        let angle = Math.PI / 2;
        if (deltaX + deltaY < 0) angle = -angle;

        if (axis.x) pivot.rotation.x += angle;
        if (axis.y) pivot.rotation.y += angle;
        if (axis.z) pivot.rotation.z += angle;

        pivot.updateMatrixWorld();
        activeCubes.forEach(cube => rubikGroup.attach(cube));
        scene.remove(pivot);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
</script>

</body>
</html>
