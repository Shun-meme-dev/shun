<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chill</title>
    <style>
       body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Đổi nền thành ảnh */
            background: url('https://i.pinimg.com/736x/da/ec/18/daec18b55af9f0e7c467bf3fe4dcb2ff.jpg') no-repeat center center fixed;
            background-size: contain; /* Giúp ảnh hiển thị đầy đủ, không bị cắt xén */
            background-color: #111; /* Thêm màu nền phụ xung quanh nếu ảnh không vừa khung màn hình */
            color: #fff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Định nghĩa animation chuyển màu nền */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            margin: 10px 0 20px 0;
            font-size: 24px;
        }

        .message-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 15px;
            color: #f1f2f6;
            line-height: 1.5;
        }

        .btn {
            background: #fff;
            color: #1e3c72;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background: #ff4757;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(255, 71, 87, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Chào mấy con zợ, Shun nè ( Duy Hoàng )! ƪ(˘⌣˘)ʃ</h1>
        
        <div class="message-box">
            Giỏi thì bấm nút bên dưới đi! ( •̀ ω •́ )y
        </div>

        <!-- Nút bấm tương tác -->
        <button class="btn" onclick="thongBao()">Bấm đi</button>
    </div>

    <script>
        // Hàm chạy khi người dùng bấm nút
        function thongBao() {
            alert("Máy của chúng m đã bị hack ( •̀ ω •́ )✧");
        }
    </script>

</body>
</html>
