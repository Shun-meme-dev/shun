<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chill</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 400px;
            width: 100%;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 {
            margin: 10px 0;
            font-size: 24px;
        }
        p {
            font-size: 15px;
            color: #ddd;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn {
            background: #fff;
            color: #1e3c72;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background: #ff7675;
            color: #fff;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Thay link ảnh của bạn vào chỗ https://via.placeholder.com/120 -->
        <img src="daec18b55af9f0e7c467bf3fe4dcb2ff.jpg" alt="Avatar" class="avatar">
        
        <h1>Chào mấy con zợ, Shun nè ( Duy Hoàng )! 👋</h1>
        <p>zô đây chơi.</p>
        
    </div>

</body>
</html>
